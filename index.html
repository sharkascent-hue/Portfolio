<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="AlmLab's portfolio as a real book on a desk. Open it, flip through the pages, visit the work.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="AlmLab | Interactive Portfolio">
<meta property="og:description" content="Feels like a book. Acts like a book. Is a book. Flip through everything we have built.">
<meta property="og:image" content="https://almlabmarketing.com/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --ink:#fff;
  --muted:rgba(255,255,255,.62);
  --sans:'Poppins',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas{outline:none}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:26px 36px;pointer-events:none}
.nav>*{pointer-events:auto}
.logo{display:block;height:22px}
.logo img{height:100%;width:auto;display:block}
.cta{font:500 13px/1 var(--sans);color:#111;background:#fff;border-radius:7px;padding:11px 15px;text-decoration:none;letter-spacing:.01em;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 8px 30px rgba(0,0,0,.6);transition:transform .25s ease,background .25s ease}
.cta:hover{transform:translateY(-1px);background:#f3f3f3}

/* ---------- headline ---------- */
.hero{position:fixed;left:36px;top:clamp(84px,14vh,132px);z-index:9;max-width:620px;pointer-events:none;transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.hero h1{margin:0;font:600 clamp(26px,3.6vw,46px)/1.06 var(--sans);letter-spacing:-.03em;text-wrap:balance}
.hero p{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:var(--muted);letter-spacing:-.005em}
.hero.away{opacity:0;transform:translateY(-14px)}

/* ---------- spread bar ---------- */
.bar{position:fixed;left:50%;bottom:28px;z-index:10;transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(14,14,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 20px 60px rgba(0,0,0,.6);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.bar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bar button,.bar a{appearance:none;border:0;background:transparent;color:#fff;font:500 12px/1 var(--sans);height:36px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s ease}
.bar button{width:36px;padding:0;justify-content:center;font-size:16px}
.bar a:hover,.bar button:hover{background:rgba(255,255,255,.09)}
.bar a .k{font:500 10px/1 var(--mono);color:var(--muted)}
.bar a .go{opacity:.6;font-size:13px}
.bar .sep{width:1px;height:18px;background:rgba(255,255,255,.12)}
.bar a.empty{display:none}

/* ---------- hints ---------- */
.hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;font:400 12px/1 var(--sans);color:var(--muted);letter-spacing:.02em;pointer-events:none;transition:opacity .5s ease;display:flex;align-items:center;gap:10px}
.hint i{display:block;width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.hint.off{opacity:0}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;transition:opacity .7s ease;}
.loader.off{opacity:0;pointer-events:none}
.loader div{width:120px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.loader b{display:block;height:100%;width:0;background:#fff;transition:width .3s ease}

@media (max-width:720px){
  .nav{padding:18px 18px}
  .logo{height:18px}
  .cta{padding:10px 12px;font-size:12px}
  .hero{left:18px;right:18px;top:84px}
  .hero p{font-size:12px}
  .bar{bottom:18px;max-width:calc(100% - 24px);overflow:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar a{padding:0 10px}
  .hint{bottom:22px}
}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>
</head>
<body>

<canvas id="gl" aria-label="A portfolio book on a desk. Click the book to open it, click pages to turn them."></canvas>

<header class="nav">
  <a class="logo" href="https://almlabmarketing.com/" aria-label="AlmLab home"><img src="img/logo.png" alt="AlmLab"></a>
  <a class="cta" href="https://almlabmarketing.com/#/strategy">Get in Touch</a>

<section class="hero" id="hero">
  <h1>Interactive Portfolio<br>that you can explore</h1>

<div class="loader" id="loader"><div><b id="loadbar"></b></div></div>

<script type="module">
import * as THREE from './three.module.min.js';

/* =====================================================================
   DATA — the work. Order matches the main site's "Our Work" numbering.
   ===================================================================== */
const WORKS = [
  { n:'01', title:'AlmLab Instant Lead Reply', url:'https://almlabmarketing.com/reply/', img:'img/reply.jpg' },
  { n:'02', title:'All Leaders Follow',        url:'https://allleadersfollow.vercel.app/index.html', img:'img/allleaders.jpg' },
  { n:'03', title:'Pentium Logistics',         url:'https://www.pentiumenvironmentallogistics.ie/', img:'img/pentium.jpg' },
  { n:'04', title:'Mejia Landscaping',         url:'https://mejia-psi.vercel.app/', img:'img/mejia.jpg' },
  { n:'05', title:'Big Bear Planetariums',     url:'http://www.bigbearplanetariums.ie/', img:'img/bigbear.png' },
  { n:'06', title:'Five Star Home Improvement',url:'https://www.5starhomeimprovements.ie/', img:'img/fivestar.jpg' },
  { n:'07', title:'Evolve Gym Equipment',      url:'https://www.evolvege.ie/', img:'img/evolve.jpg' },
  { n:'08', title:'Attics R Us',               url:'https://www.atticsrus.ie/', img:'img/attics.jpg' },
  { n:'09', title:'Quality Fencing',           url:'https://www.qualityfencing.ie/', img:'img/qualityfencing.jpg' },
  { n:'10', title:'Diamond Flooring',          url:'https://www.diamondflooringdublin.ie/', img:'img/diamond.jpg' },
  { n:'11', title:'AL Fitness & Coaching',     url:'https://www.alfitnessandcoaching.com/', img:'img/alfitness.jpg' },
  { n:'12', title:'15-50 Cabins',              url:'https://www.1550.ie/', img:'img/cabins.jpg' },
  { n:'13', title:'Manchester Paving & Patios',url:'https://www.manchesterpavingandpatios.co.uk/', img:'img/manchester.jpg' },
  { n:'14', title:'SH Interior',               url:'https://www.irsh.ie/', img:'img/shinterior.jpg' },
  { n:'15', title:'Omni Renovations',          url:'https://www.omnirenovations.ie/', img:'img/omni.jpg' },
  { n:'16', title:'Seattle Core Masonry',      url:'https://www.chimneyrepairsseattle.com/', img:'img/seattle.jpg' },
  { n:'17', title:'Floor Trade Ireland',       url:'https://www.floortradeireland.ie/', img:'img/floortrade.jpg' },
  { n:'18', title:'Supreme Landscapes',        url:'https://www.supremelandscapesdublin.ie/', img:'img/supreme.jpg' },
];

/* =====================================================================
   BOOK GEOMETRY CONSTANTS
   ===================================================================== */
const PAGE_W = 1.5;        // page width (spine → fore edge)
const PAGE_H = 1.0;        // page height (depth on the desk)
const PAGE_T = 0.011;      // leaf thickness
const COVER_T = 0.03;      // cover thickness
const COVER_OVER = 0.03;   // cover overhang beyond the leaves
const SEGS = 48;           // bend segments along the page width
const TEX_W = 1536, TEX_H = 1024;   // page texture (1.5 : 1)

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 60);

/* camera rigs: the book never moves — the camera dollies in, like the reference.
   `fit` is the world width that must stay inside the viewport; portrait phones get a
   tighter, page-at-a-time framing. */
const RIG = {
  closed: { pos:new THREE.Vector3( 0.85, 4.7, 4.3), look:new THREE.Vector3( 0.85, 0, 0.05), fit: 2.3 },
  open:   { pos:new THREE.Vector3( 0.00, 3.0, 2.85), look:new THREE.Vector3( 0.00, 0, -0.05), fit: 3.6 },
};
function rigFor(name) {
  const r = RIG[name], portrait = innerWidth / innerHeight < 1;
  if (!portrait) return r;
  if (name === 'open') return { pos: new THREE.Vector3(0.75, 3.4, 2.6), look: new THREE.Vector3(0.75, 0, -0.1), fit: 2.0 };
  return { pos: r.pos, look: r.look, fit: 2.1 };
}
const camState = { pos:RIG.closed.pos.clone(), look:RIG.closed.look.clone(), fit:RIG.closed.fit, fromPos:RIG.closed.pos.clone(), fromLook:RIG.closed.look.clone(), fromFit:RIG.closed.fit, toPos:RIG.closed.pos.clone(), toLook:RIG.closed.look.clone(), toFit:RIG.closed.fit, t:1, dur:1.4, name:'closed' };

/* =====================================================================
   LIGHTS — one hard desk lamp from above, a whisper of fill.
   ===================================================================== */
scene.add(new THREE.HemisphereLight(0x3b4250, 0x050505, 0.16));

const lamp = new THREE.SpotLight(0xfff1dd, 470, 22, 0.44, 0.9, 2);
lamp.position.set(0.3, 7.2, 1.6);
lamp.target.position.set(0.3, 0, -0.1);
lamp.castShadow = true;
lamp.shadow.mapSize.set(2048, 2048);
lamp.shadow.bias = -0.0004;
lamp.shadow.normalBias = 0.01;
lamp.shadow.radius = 4;
lamp.shadow.camera.near = 2; lamp.shadow.camera.far = 14;
scene.add(lamp, lamp.target);

const rim = new THREE.DirectionalLight(0xbfd4ff, 0.35);
rim.position.set(-4, 3, -5);
scene.add(rim);

/* =====================================================================
   DESK — dark oak, procedurally grained.
   ===================================================================== */
function woodTexture(size = 1024) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#0f0d09'; g.fillRect(0, 0, size, size);
  // long grain streaks
  for (let i = 0; i < 2200; i++) {
    const y = Math.random() * size;
    const len = 120 + Math.random() * 900;
    const x = Math.random() * size - len * 0.3;
    const a = 0.04 + Math.random() * 0.16;
    const light = Math.random() < 0.5;
    g.strokeStyle = light ? `rgba(150,122,82,${a})` : `rgba(0,0,0,${a * 1.2})`;
    g.lineWidth = 0.6 + Math.random() * 1.8;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + len * .33, y + (Math.random() - .5) * 6, x + len * .66, y + (Math.random() - .5) * 6, x + len, y + (Math.random() - .5) * 3);
    g.stroke();
  }
  // broad tonal bands (planks / figure)
  for (let i = 0; i < 14; i++) {
    const y = Math.random() * size, h = 40 + Math.random() * 160;
    const grd = g.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(.5, `rgba(${Math.random()<.5?'0,0,0':'90,70,45'},${0.05+Math.random()*0.08})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, y, size, h);
  }
  // fine noise
  const id = g.getImageData(0, 0, size, size), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const desk = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.62, metalness: 0.08, color: 0xd9cdb8 })
);
desk.rotation.x = -Math.PI / 2;
desk.receiveShadow = true;
scene.add(desk);

/* =====================================================================
   PROPS — succulent, coffee, pencil, set square. Modelled from primitives.
   ===================================================================== */
const props = new THREE.Group(); scene.add(props);
const std = (o) => new THREE.MeshStandardMaterial(o);
function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// succulent in a concrete pot (top-left)
{
  const g = new THREE.Group();
  const pot = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.14, 0.26, 40), std({ color: 0xc9c3b8, roughness: 0.95 })));
  pot.position.y = 0.13; g.add(pot);
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 40), std({ color: 0x2b2420, roughness: 1 }));
  soil.position.y = 0.25; g.add(soil);
  const leafMat = std({ color: 0x9fc4bd, roughness: 0.6 });
  const leafGeo = new THREE.SphereGeometry(0.075, 14, 10);
  leafGeo.scale(1, 0.32, 0.55);
  for (let ring = 0; ring < 3; ring++) {
    const count = [12, 9, 6][ring], r = [0.11, 0.075, 0.035][ring], tilt = [0.55, 0.9, 1.25][ring];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + ring * 0.35;
      const leaf = shadowed(new THREE.Mesh(leafGeo, leafMat));
      leaf.position.set(Math.cos(a) * r, 0.27 + ring * 0.035, Math.sin(a) * r);
      leaf.rotation.set(0, -a, 0);
      leaf.rotateZ(-tilt + 1.2);
      leaf.scale.setScalar(1 - ring * 0.2);
      g.add(leaf);
    }
  }
  g.position.set(-1.3, 0, -0.5); g.scale.setScalar(1.25);
  props.add(g);
}

// coffee with a latte heart (top-right)
{
  const g = new THREE.Group();
  const porcelain = std({ color: 0xf4f1ea, roughness: 0.35, metalness: 0.02 });
  const saucer = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.26, 0.03, 48), porcelain));
  saucer.position.y = 0.015; g.add(saucer);
  const cup = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.145, 0.22, 48, 1, true), porcelain));
  cup.material = porcelain.clone(); cup.material.side = THREE.DoubleSide;
  cup.position.y = 0.14; g.add(cup);
  const cupBase = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 0.02, 48), porcelain); cupBase.position.y = 0.04; g.add(cupBase);
  const handle = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.022, 12, 32, Math.PI), porcelain));
  handle.position.set(0.19, 0.15, 0); handle.rotation.set(0, 0, -Math.PI / 2); handle.rotateY(Math.PI / 2); g.add(handle);
  // latte surface
  const lc = document.createElement('canvas'); lc.width = lc.height = 256;
  const lg = lc.getContext('2d');
  lg.fillStyle = '#9c6a3c'; lg.fillRect(0, 0, 256, 256);
  const rg = lg.createRadialGradient(128, 128, 20, 128, 128, 130); rg.addColorStop(0, 'rgba(120,80,45,0)'); rg.addColorStop(1, 'rgba(70,40,20,.6)');
  lg.fillStyle = rg; lg.fillRect(0, 0, 256, 256);
  lg.fillStyle = '#efe3d2';
  lg.beginPath(); lg.moveTo(128, 190);
  lg.bezierCurveTo(60, 140, 70, 70, 128, 95); lg.bezierCurveTo(186, 70, 196, 140, 128, 190); lg.fill();
  lg.strokeStyle = 'rgba(120,75,40,.5)'; lg.lineWidth = 3; lg.beginPath(); lg.moveTo(128, 100); lg.lineTo(128, 185); lg.stroke();
  const lt = new THREE.CanvasTexture(lc); lt.colorSpace = THREE.SRGBColorSpace;
  const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.175, 48), std({ map: lt, roughness: 0.25 }));
  coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.225; g.add(coffee);
  // spoon
  const steel = std({ color: 0xd8d8dc, roughness: 0.25, metalness: 0.9 });
  const spoon = new THREE.Group();
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.045, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), steel); bowl.scale.set(1, 0.35, 1.35); bowl.rotation.x = Math.PI; bowl.position.set(0, 0.012, 0.11);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.006, 0.22), steel); stem.position.set(0, 0.012, -0.05);
  spoon.add(shadowed(bowl), shadowed(stem)); spoon.position.set(-0.17, 0.03, 0.12); spoon.rotation.y = 0.9;
  g.add(spoon);
  g.position.set(2.5, 0, -0.7);
  props.add(g);
}

// pencil (bottom-left)
{
  const g = new THREE.Group();
  const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.95, 6), std({ color: 0x1d1d1f, roughness: 0.5 })));
  body.rotation.z = Math.PI / 2; g.add(body);
  const wood = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.09, 6), std({ color: 0xd9b98a, roughness: 0.9 })));
  wood.rotation.z = -Math.PI / 2; wood.position.x = 0.52; g.add(wood);
  const lead = new THREE.Mesh(new THREE.ConeGeometry(0.006, 0.03, 6), std({ color: 0x222, roughness: 0.4 }));
  lead.rotation.z = -Math.PI / 2; lead.position.x = 0.58; g.add(lead);
  const ferrule = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.05, 12), std({ color: 0xbfc3c8, roughness: 0.3, metalness: 0.8 }));
  ferrule.rotation.z = Math.PI / 2; ferrule.position.x = -0.46; g.add(ferrule);
  const eraser = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.035, 12), std({ color: 0xe9a7a0, roughness: 0.9 }));
  eraser.rotation.z = Math.PI / 2; eraser.position.x = -0.5; g.add(eraser);
  g.position.set(-1.25, 0.018, 0.85);
  g.rotation.y = 0.78;
  props.add(g);
}

// set square (bottom-right)
{
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(0.55, 0); shape.lineTo(0, 0.55); shape.closePath();
  const hole = new THREE.Path(); hole.moveTo(0.1, 0.1); hole.lineTo(0.3, 0.1); hole.lineTo(0.1, 0.3); hole.closePath();
  shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.012, bevelEnabled: false });
  const sq = shadowed(new THREE.Mesh(geo, std({ color: 0xf1f1f1, roughness: 0.3, transparent: true, opacity: 0.92 })));
  sq.rotation.x = -Math.PI / 2;
  sq.position.set(2.3, 0.012, 0.85);
  sq.rotation.z = 0.35;
  props.add(sq);
}

/* =====================================================================
   PAGE TEXTURES — every page face is a 1536×1024 canvas.
   ===================================================================== */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function texFromCanvas(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  return t;
}
function pageCanvas() { const c = document.createElement('canvas'); c.width = TEX_W; c.height = TEX_H; return c; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

let logoImg = null;
function drawLogo(g, x, y, h, color) {
  // the source logo is white; recolour it through an offscreen canvas
  const ratio = logoImg.width / logoImg.height, w = h * ratio;
  const o = document.createElement('canvas'); o.width = Math.ceil(w); o.height = Math.ceil(h);
  const og = o.getContext('2d');
  og.drawImage(logoImg, 0, 0, w, h);
  og.globalCompositeOperation = 'source-in'; og.fillStyle = color; og.fillRect(0, 0, w, h);
  g.drawImage(o, x, y);
  return w;
}
function paperGrain(g, alpha = 0.035) {
  const id = g.getImageData(0, 0, TEX_W, TEX_H), d = id.data, k = alpha * 255;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * k; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
}

function coverTexture() {
  const c = pageCanvas(), g = c.getContext('2d');
  g.fillStyle = '#0d0d0f'; g.fillRect(0, 0, TEX_W, TEX_H);
  const v = g.createRadialGradient(TEX_W * .5, TEX_H * .45, 100, TEX_W * .5, TEX_H * .45, 1100);
  v.addColorStop(0, 'rgba(255,255,255,.07)'); v.addColorStop(1, 'rgba(0,0,0,.25)');
  g.fillStyle = v; g.fillRect(0, 0, TEX_W, TEX_H);
  paperGrain(g, 0.06);
  const h = 92, w = h * (logoImg.width / logoImg.height);
  drawLogo(g, (TEX_W - w) / 2, (TEX_H - h) / 2 - 10, h, '#f5f5f5');
  g.fillStyle = 'rgba(255,255,255,.42)'; g.font = '500 22px "JetBrains Mono", monospace'; g.textAlign = 'center';
  g.fillText('PORTFOLIO  ·  2026', TEX_W / 2, TEX_H - 110);
  return texFromCanvas(c);
}
function coverBackTexture() {
  const c = pageCanvas(), g = c.getContext('2d');
  g.fillStyle = '#0c0c0e'; g.fillRect(0, 0, TEX_W, TEX_H);
  paperGrain(g, 0.06);
  const h = 44, w = h * (logoImg.width / logoImg.height);
  drawLogo(g, (TEX_W - w) / 2, TEX_H - 150, h, 'rgba(255,255,255,.75)');
  g.fillStyle = 'rgba(255,255,255,.35)'; g.font = '400 20px "JetBrains Mono", monospace'; g.textAlign = 'center';
  g.fillText('almlabmarketing.com', TEX_W / 2, TEX_H - 72);
  return texFromCanvas(c);
}
const CONTENT_ROWS = [];  // hit regions for the contents page, in texture px
function contentsTexture() {
  const c = pageCanvas(), g = c.getContext('2d');
  g.fillStyle = '#f7f6f2'; g.fillRect(0, 0, TEX_W, TEX_H);
  paperGrain(g, 0.03);
  const pad = 110;
  drawLogo(g, pad, 86, 34, '#141414');
  g.fillStyle = '#141414'; g.font = '500 78px Poppins, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.letterSpacing = '-3px';
  g.fillText('Contents', pad, 290);
  g.letterSpacing = '0px';
  g.fillStyle = 'rgba(20,20,20,.5)'; g.font = '400 20px "JetBrains Mono", monospace';
  g.fillText('18 projects · click one', pad, 335);
  const colX = [640, 1090], top = 232, step = 62;
  WORKS.forEach((w, i) => {
    const col = Math.floor(i / 9), row = i % 9;
    const x = colX[col], y = top + row * step;
    g.fillStyle = 'rgba(20,20,20,.45)'; g.font = '500 19px "JetBrains Mono", monospace'; g.fillText(w.n, x, y);
    g.fillStyle = '#1a1a1a'; g.font = '500 26px Poppins, sans-serif'; g.letterSpacing = '-0.5px'; g.fillText(w.title, x + 48, y);
    g.letterSpacing = '0px';
    g.fillStyle = 'rgba(20,20,20,.08)'; g.fillRect(x, y + 16, 400, 2);
    CONTENT_ROWS.push({ x0: x - 10, x1: x + 410, y0: y - 32, y1: y + 22, spread: Math.floor(i / 2) + 1 });
  });
  g.fillStyle = 'rgba(20,20,20,.45)'; g.font = '400 20px "JetBrains Mono", monospace';
  g.fillText('AlmLab — the formula for growth', pad, TEX_H - 90);
  return texFromCanvas(c);
}
function endTexture() {
  const c = pageCanvas(), g = c.getContext('2d');
  g.fillStyle = '#f7f6f2'; g.fillRect(0, 0, TEX_W, TEX_H);
  paperGrain(g, 0.03);
  const h = 96, w = h * (logoImg.width / logoImg.height);
  drawLogo(g, (TEX_W - w) / 2, (TEX_H - h) / 2 - 30, h, '#141414');
  g.fillStyle = 'rgba(20,20,20,.55)'; g.font = '400 22px "JetBrains Mono", monospace'; g.textAlign = 'center';
  g.fillText('WEBSITES  ·  ADS  ·  SOCIAL  ·  SEO', TEX_W / 2, TEX_H / 2 + 80);
  g.fillStyle = '#141414'; g.font = '500 24px Poppins, sans-serif';
  g.fillText('almlabmarketing.com', TEX_W / 2, TEX_H - 96);
  return texFromCanvas(c);
}
function workTexture(img) {
  const c = pageCanvas(), g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, TEX_W, TEX_H);
  const ir = img.width / img.height, pr = TEX_W / TEX_H;
  let sw, sh, sx, sy;
  if (ir > pr) { sh = img.height; sw = sh * pr; sx = (img.width - sw) / 2; sy = 0; }       // wide: crop sides
  else { sw = img.width; sh = sw / pr; sx = 0; sy = 0; }                                   // tall: keep the top
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, TEX_W, TEX_H);
  // a whisper of ink at the spine side so pages read as paper, not screens
  const s = g.createLinearGradient(0, 0, 90, 0); s.addColorStop(0, 'rgba(0,0,0,.16)'); s.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = s; g.fillRect(0, 0, 90, TEX_H);
  return texFromCanvas(c);
}

/* =====================================================================
   PAGE MESH — a strip of SEGS quads that bends around the spine.
   Front face shows `map`, back face shows `backMap` (mirrored).
   ===================================================================== */
function pageGeometry(w, h) {
  // two coincident layers: layer 0 faces +y (front texture), layer 1 faces -y (back texture, mirrored).
  // Each layer is single-sided, so only the visible one survives culling — no z-fight, correct normals.
  const geo = new THREE.BufferGeometry();
  const rows = 2, cols = SEGS + 1, per = rows * cols;
  const pos = new Float32Array(per * 2 * 3), uv = new Float32Array(per * 2 * 2), idx = [];
  for (let layer = 0; layer < 2; layer++) for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = layer * per + r * cols + c, x = (c / SEGS) * w, z = r === 0 ? -h / 2 : h / 2;
    pos.set([x, 0, z], i * 3);
    uv.set([layer === 0 ? c / SEGS : 1 - c / SEGS, r === 0 ? 1 : 0], i * 2);
  }
  for (let c = 0; c < SEGS; c++) { const a = c, b = c + 1, d = cols + c, e = cols + c + 1; idx.push(a, d, b, b, d, e); }
  const front = idx.length;
  for (let c = 0; c < SEGS; c++) { const a = per + c, b = per + c + 1, d = per + cols + c, e = per + cols + c + 1; idx.push(a, b, d, b, e, d); }
  geo.setIndex(idx);
  geo.addGroup(0, front, 0);
  geo.addGroup(front, idx.length, 1);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  return geo;
}
function pageMaterials(front, back, roughness = 0.62) {
  return [
    new THREE.MeshStandardMaterial({ map: front, roughness, metalness: 0, side: THREE.FrontSide }),
    new THREE.MeshStandardMaterial({ map: back, roughness, metalness: 0, side: THREE.FrontSide }),
  ];
}

class Page {
  constructor(index, front, back, { thick = PAGE_T, width = PAGE_W, height = PAGE_H, stiff = 0.62 } = {}) {
    this.index = index; this.width = width; this.height = height; this.thick = thick; this.stiff = stiff;
    this.turn = 0; this.target = 0; this.vel = 0; this.hover = 0; this.hoverT = 0;
    this.geo = pageGeometry(width, height);
    this.mesh = new THREE.Mesh(this.geo, pageMaterials(front, back));
    this.mesh.castShadow = true; this.mesh.receiveShadow = true;
    this.mesh.userData.page = this;
    this.dirty = true;
  }
  // base elevation of the hinge for this leaf, given its turn amount
  elevation(n, t) {
    // leaves beneath this one on each side, resting on the back board
    const right = COVER_T + (n - 1 - this.index) * PAGE_T, left = COVER_T + this.index * PAGE_T;
    return right + (left - right) * t;
  }
  update(n, dt) {
    // critically damped spring toward target, plus a hover lift
    const k = 42, d = 2 * Math.sqrt(k) * 1.05;
    const a = -k * (this.turn - this.target) - d * this.vel;
    this.vel += a * dt; this.turn += this.vel * dt;
    if (Math.abs(this.turn - this.target) < 0.0004 && Math.abs(this.vel) < 0.002) { this.turn = this.target; this.vel = 0; }
    this.hoverT += (this.hover - this.hoverT) * Math.min(1, dt * 9);
    const t = THREE.MathUtils.clamp(this.turn, 0, 1);
    const lift = this.hoverT * (this.target < 0.5 ? 1 : -1) * 0.075;
    const theta = Math.PI * t + lift * Math.PI;
    const moving = Math.abs(this.vel) > 0.001 || Math.abs(this.hover - this.hoverT) > 0.001 || this.dirty;
    if (!moving) return;
    this.dirty = false;
    // curl: the fore edge trails behind the hinge in the direction of travel,
    // and a hovered leaf curls its edge upward
    const travel = THREE.MathUtils.clamp(this.vel * 0.9, -1, 1);
    const curl = Math.sin(Math.PI * t) * this.stiff * travel;
    const liftCurl = lift * 2.6;
    const pos = this.geo.attributes.position.array, cols = SEGS + 1, per = 2 * cols, ds = this.width / SEGS;
    const y0 = this.elevation(n, t) + 0.0012;
    let x = 0, y = y0;
    for (let c = 0; c <= SEGS; c++) {
      const s = c / SEGS;
      if (c > 0) {
        const a2 = theta - (curl - liftCurl) * Math.pow(s, 1.25);
        x += ds * Math.cos(a2); y += ds * Math.sin(a2);
      }
      const yy = Math.max(y, 0.002);
      for (const i of [c, cols + c, per + c, per + cols + c]) { pos[i * 3] = x; pos[i * 3 + 1] = yy; }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
    this.geo.computeBoundingSphere();
  }
}

/* =====================================================================
   BOOK — assembled after textures load.
   ===================================================================== */
const book = new THREE.Group(); scene.add(book);
const pages = [];
let N = 0;            // number of leaves
let spread = 0;       // how many leaves are turned (0 = closed front, N = closed back)
let opened = false;

function buildBook(tex) {
  // front cover (its back is the contents page)
  pages.push(new Page(0, tex.cover, tex.contents, { thick: COVER_T, width: PAGE_W + COVER_OVER, height: PAGE_H + COVER_OVER * 2, stiff: 0.22 }));
  // leaves: two works each
  for (let i = 0; i < WORKS.length; i += 2) pages.push(new Page(pages.length, tex.works[i], tex.works[i + 1] ?? tex.end));
  // back cover (front face = end page)
  pages.push(new Page(pages.length, tex.end, tex.coverBack, { thick: COVER_T, width: PAGE_W + COVER_OVER, height: PAGE_H + COVER_OVER * 2, stiff: 0.22 }));
  N = pages.length;
  pages.forEach(p => book.add(p.mesh));

  // a solid block under the leaves so the closed book reads as thick, plus a spine
  const blockH = N * PAGE_T + COVER_T;
  const blockGeo = new THREE.BoxGeometry(PAGE_W - 0.01, blockH, PAGE_H - 0.004);
  const edgeMat = std({ color: 0xece7dc, roughness: 0.9 });
  const block = new THREE.Mesh(blockGeo, [edgeMat, edgeMat, edgeMat, edgeMat, edgeMat, edgeMat]);
  block.position.set(PAGE_W / 2, blockH / 2, 0);
  block.castShadow = true; block.receiveShadow = true;
  block.userData.block = true;
  book.add(block);
  book.userData.block = block;
  const spine = new THREE.Mesh(new THREE.BoxGeometry(COVER_T * 1.4, blockH + COVER_T * 2, PAGE_H + COVER_OVER * 2), std({ color: 0x0d0d0f, roughness: 0.55 }));
  spine.position.set(-COVER_T * 0.5, (blockH + COVER_T * 2) / 2, 0);
  spine.castShadow = true; spine.receiveShadow = true;
  book.add(spine);
  book.userData.spine = spine;
  // back cover resting on the desk
  const backBoard = new THREE.Mesh(new THREE.BoxGeometry(PAGE_W + COVER_OVER, COVER_T, PAGE_H + COVER_OVER * 2), std({ color: 0x0d0d0f, roughness: 0.55 }));
  backBoard.position.set((PAGE_W + COVER_OVER) / 2, COVER_T / 2, 0);
  backBoard.castShadow = true; backBoard.receiveShadow = true;
  book.add(backBoard);
  book.userData.backBoard = backBoard;
  setSpread(0, true);
}

/* the solid blocks stand in for the leaves beneath the top page on each side */
function updateBlock() {
  const b = book.userData.block; if (!b) return;
  const full = N * PAGE_T + COVER_T;
  let rightCount = 0, leftCount = 0;
  for (const p of pages) { if (p.turn < 0.5) rightCount++; else leftCount++; }
  const rightH = Math.max(0, rightCount - 1) * PAGE_T, leftH = Math.max(0, leftCount - 1) * PAGE_T;
  let lb = book.userData.leftBlock;
  if (!lb) {
    lb = b.clone(); lb.material = b.material; book.add(lb); book.userData.leftBlock = lb;
    const lboard = book.userData.backBoard.clone(); lboard.position.x = -(PAGE_W + COVER_OVER) / 2; book.add(lboard); book.userData.leftBoard = lboard;
  }
  const place = (m, h, x) => { m.visible = h > 0.0005; m.scale.y = Math.max(0.0001, h - 0.0015) / full; m.position.set(x, COVER_T + (h - 0.0015) / 2, 0); };
  place(b, rightH, PAGE_W / 2);
  place(lb, leftH, -PAGE_W / 2);
  book.userData.leftBoard.visible = leftCount > 0;
  book.userData.backBoard.visible = rightCount > 0;
}

let flipTimers = [];
function setSpread(s, instant = false) {
  s = THREE.MathUtils.clamp(s, 0, N);
  const dir = Math.sign(s - spread);
  flipTimers.forEach(clearTimeout); flipTimers = [];
  const order = [];
  for (let i = 0; i < N; i++) if ((i < s) !== (pages[i].target === 1)) order.push(i);
  if (dir < 0) order.reverse();
  order.forEach((i, k) => {
    const go = () => { pages[i].target = i < s ? 1 : 0; pages[i].dirty = true; };
    if (instant || reduceMotion) { go(); if (instant) { pages[i].turn = pages[i].target; pages[i].vel = 0; } }
    else flipTimers.push(setTimeout(go, k * 90));
  });
  spread = s;
  updateBlock();
  updateUI();
  const shouldOpen = spread > 0 && spread < N;
  if (shouldOpen !== opened) { opened = shouldOpen; moveCamera(opened ? 'open' : 'closed'); }
}

/* =====================================================================
   CAMERA MOTION
   ===================================================================== */
function moveCamera(name, dur = 1.5) {
  const rig = rigFor(name); camState.name = name;
  camState.fromPos.copy(camState.pos); camState.fromLook.copy(camState.look); camState.fromFit = camState.fit;
  camState.toPos.copy(rig.pos); camState.toLook.copy(rig.look); camState.toFit = rig.fit;
  camState.t = reduceMotion ? 1 : 0; camState.dur = dur;
}
const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const pointer = new THREE.Vector2(0, 0), pointerSmooth = new THREE.Vector2(0, 0);
function fitCamera() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
const _dir = new THREE.Vector3();
function updateCamera(dt) {
  if (camState.t < 1) {
    camState.t = Math.min(1, camState.t + dt / camState.dur); const e = easeInOut(camState.t);
    camState.pos.lerpVectors(camState.fromPos, camState.toPos, e); camState.look.lerpVectors(camState.fromLook, camState.toLook, e);
    camState.fit = camState.fromFit + (camState.toFit - camState.fromFit) * e;
  }
  pointerSmooth.lerp(pointer, Math.min(1, dt * 3));
  // dolly back just enough that `fit` world units span the viewport width
  _dir.subVectors(camState.pos, camState.look);
  const dist = _dir.length();
  const halfVisible = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  const push = Math.max(1, (camState.fit / 2) / halfVisible);
  const p = _dir.multiplyScalar(push).add(camState.look);
  p.x += pointerSmooth.x * 0.12; p.y += -pointerSmooth.y * 0.06; p.z += pointerSmooth.y * 0.05;
  camera.position.copy(p);
  camera.lookAt(camState.look.x + pointerSmooth.x * 0.04, camState.look.y, camState.look.z + pointerSmooth.y * 0.03);
}

/* =====================================================================
   INTERACTION — hover lifts the top leaf, click turns it.
   ===================================================================== */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hoverSide = 0; // -1 left, 1 right, 0 none
let hit = null;

function pick(clientX, clientY) {
  ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = [...pages.map(p => p.mesh), book.userData.block, book.userData.leftBlock, book.userData.backBoard, book.userData.leftBoard].filter(Boolean);
  const r = ray.intersectObjects(objs, false);
  return r.length ? r[0] : null;
}
function sideOf(i) {
  // which half of the open book the hit belongs to
  const x = i.point.x - book.position.x;
  return x < 0 ? -1 : 1;
}
function setHover(side) {
  if (side === hoverSide) return;
  hoverSide = side;
  pages.forEach(p => p.hover = 0);
  if (!opened) { if (side && spread === 0) pages[0].hover = 1; if (side && spread === N) pages[N - 1].hover = 1; }
  else if (side === 1 && spread < N) pages[spread].hover = 1;
  else if (side === -1 && spread > 0) pages[spread - 1].hover = 1;
  canvas.style.cursor = side ? 'pointer' : 'default';
}

function onMove(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
  hit = pick(e.clientX, e.clientY);
  setHover(hit ? (opened ? sideOf(hit) : 1) : 0);
}
function onTap(e) {
  const h = pick(e.clientX, e.clientY);
  if (!h) return;
  document.getElementById('hint').classList.add('off');
  if (!opened) {
    if (spread === 0) setSpread(1);
    else setSpread(0);      // closed at the back: flip everything home
    return;
  }
  const side = sideOf(h);
  // contents page: jump straight to a project
  const pg = h.object.userData.page;
  if (side === -1 && pg && pg.index === 0 && h.uv) {
    const px = (1 - h.uv.x) * TEX_W, py = (1 - h.uv.y) * TEX_H;
    const row = CONTENT_ROWS.find(r => px >= r.x0 && px <= r.x1 && py >= r.y0 && py <= r.y1);
    if (row) { setSpread(row.spread); return; }
  }
  if (side === 1 && spread === N - 1) { setSpread(0); return; }   // the back cover closes the book and sends it home
  setSpread(spread + side);
}
let downAt = null;
canvas.addEventListener('pointermove', onMove, { passive: true });
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  if (moved < 8 && performance.now() - downAt.t < 600) onTap(e);
  downAt = null;
});
canvas.addEventListener('pointerleave', () => { setHover(0); pointer.set(0, 0); });
addEventListener('keydown', (e) => {
  if (!N) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); setSpread(spread >= N - 1 ? 0 : spread + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); setSpread(spread - 1); }
  if (e.key === 'Escape') setSpread(0);
  if (e.key === 'Home') setSpread(1);
  if (e.key === 'End') setSpread(N - 1);
});
document.getElementById('prev').addEventListener('click', () => setSpread(spread - 1));
document.getElementById('next').addEventListener('click', () => setSpread(spread >= N - 1 ? 0 : spread + 1));

/* =====================================================================
   UI — headline retreats when the book opens; spread bar names the works
   ===================================================================== */
const hero = document.getElementById('hero'), bar = document.getElementById('bar');
const touchOnly = matchMedia('(hover: none)').matches;
if (touchOnly) {
  hero.querySelector('p').textContent = 'Tap the book to open it, tap a page to turn it, tap a name below to visit the site';
  document.getElementById('hint').innerHTML = '<i></i> Tap the book to open it';
}
const linkL = document.getElementById('linkL'), linkR = document.getElementById('linkR');
function workOnFace(leaf, face) {
  // returns the work shown on a face, or null. leaf 0 back = contents; last leaf front = end page
  if (leaf <= 0 || leaf >= N - 1 && face === 'front') return null;
  const w = face === 'front' ? WORKS[(leaf - 1) * 2] : WORKS[(leaf - 1) * 2 + 1];
  return w ?? null;
}
function setLink(el, w) {
  el.classList.toggle('empty', !w);
  if (!w) return;
  el.href = w.url; el.innerHTML = `<span class="k">${w.n}</span>${w.title}<span class="go">↗</span>`;
}
function updateUI() {
  const open = spread > 0 && spread < N;
  hero.classList.toggle('away', open);
  bar.classList.toggle('on', open);
  setLink(linkL, open ? workOnFace(spread - 1, 'back') : null);
  setLink(linkR, open ? workOnFace(spread, 'front') : null);
  document.getElementById('prev').disabled = spread <= 0;
  document.getElementById('next').disabled = false;
  const hint = document.getElementById('hint');
  if (!open) hint.innerHTML = `<i></i> ${touchOnly ? 'Tap' : 'Click'} the book to open it`;
}

/* =====================================================================
   LOAD → BUILD → RUN
   ===================================================================== */
const loadbar = document.getElementById('loadbar');
async function boot() {
  let done = 0; const total = WORKS.length + 2;
  const tick = () => { done++; loadbar.style.width = `${(done / total) * 100}%`; };
  const fontsReady = Promise.all([document.fonts.load('500 78px Poppins'), document.fonts.load('500 26px Poppins'), document.fonts.load('400 20px "JetBrains Mono"')]).catch(() => {}).then(tick);
  logoImg = await loadImg('img/logo.png'); tick();
  const imgs = await Promise.all(WORKS.map(w => loadImg(w.img).then(i => { tick(); return i; })));
  await fontsReady;
  const tex = {
    cover: coverTexture(), coverBack: coverBackTexture(), contents: contentsTexture(), end: endTexture(),
    works: imgs.map(workTexture),
  };
  buildBook(tex);
  window.almBook = { go: setSpread, get spread() { return spread; }, get pages() { return N; } };
  fitCamera();
  document.getElementById('loader').classList.add('off');
  requestAnimationFrame(loop);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  fitCamera();
  if (N) moveCamera(camState.name, 0.6);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pages.forEach(p => p.update(N, dt));
  updateBlock();
  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
boot().catch(err => { console.error(err); document.getElementById('loader').innerHTML = `<p style="font:14px Poppins;color:#fff">Could not load the book. ${err?.message ?? ''}</p>`; });
</script>
</body>
</html>
