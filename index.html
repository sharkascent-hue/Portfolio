<style>
:root{
  --bg:#000; --ink:#fff; --muted:rgba(255,255,255,.62);
  --sans:'Poppins',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.grade{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 95% at 50% 55%,transparent 45%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%)}
@media (orientation:portrait){.grade{background:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 30%,transparent 42%,transparent 70%,rgba(0,0,0,.5) 82%,rgba(0,0,0,.95) 100%),radial-gradient(140% 70% at 50% 56%,transparent 40%,rgba(0,0,0,.6) 100%)}}
.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:26px 36px;pointer-events:none}
.nav>*{pointer-events:auto}
.logo{display:block;height:22px;opacity:0}
.logo img{height:100%;width:auto;display:block}
.cta{font:500 13px/1 var(--sans);color:#111;background:#fff;border-radius:7px;padding:11px 15px;text-decoration:none;letter-spacing:.01em;box-shadow:0 8px 30px rgba(0,0,0,.6);transition:transform .25s ease,background .25s ease;opacity:0}
.cta:hover{transform:translateY(-1px);background:#f3f3f3}
.hero{position:fixed;left:36px;top:clamp(76px,14vh,132px);z-index:9;max-width:620px;pointer-events:none}
.hero h1{margin:0;font:600 clamp(24px,min(3.6vw,5.6vh),46px)/1.06 var(--sans);letter-spacing:-.03em}
.hero h1 span{display:block;opacity:0;transform:translateY(22px)}
.hero p{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:var(--muted);opacity:0}
.bar{position:fixed;left:50%;bottom:28px;z-index:10;transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(14,14,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 20px 60px rgba(0,0,0,.6);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.bar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bar button,.bar a{appearance:none;border:0;background:transparent;color:#fff;font:500 12px/1 var(--sans);height:36px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s ease}
.bar button{width:36px;padding:0;justify-content:center;font-size:16px}
.bar a:hover,.bar button:hover{background:rgba(255,255,255,.09)}
.bar button:focus-visible,.bar a:focus-visible,.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar a .k{font:500 10px/1 var(--mono);color:var(--muted)}
.bar a .go{opacity:.6;font-size:13px}
.bar .sep{width:1px;height:18px;background:rgba(255,255,255,.12)}
.bar a.empty{display:none}
.hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;font:400 12px/1 var(--sans);color:var(--muted);letter-spacing:.02em;pointer-events:none;transition:opacity .5s ease;display:flex;align-items:center;gap:10px;opacity:0;white-space:nowrap}
.hint i{display:block;width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.hint.off{opacity:0!important}
.hint.up{bottom:96px}
.bar a.dim{opacity:.4}
.tip{position:fixed;z-index:11;pointer-events:none;font:500 12px/1 var(--sans);color:#111;background:#fff;border-radius:999px;padding:8px 12px;transform:translate(14px,14px);opacity:0;transition:opacity .2s ease;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip.on{opacity:1}
.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;transition:opacity .9s ease}
.loader.off{opacity:0;pointer-events:none}
.loader div{width:120px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.loader b{display:block;height:100%;width:0;background:#fff;transition:width .3s ease}
@media (max-width:720px){
  .nav{padding:18px}.logo{height:18px}.cta{padding:10px 12px;font-size:12px}
  .hero{left:18px;right:18px;top:84px}.hero p{font-size:12px}
  .bar{bottom:18px;max-width:calc(100% - 24px);overflow:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.bar a{padding:0 10px}
  .hint{bottom:22px}
}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>

<body>

<canvas id="gl" aria-label="A portfolio book on a desk. Click the book to open it, scroll to turn the pages, click a page to visit the site."></canvas>
<div class="grade" aria-hidden="true"></div>

<header class="nav">
  <a class="logo" id="navLogo" href="https://almlabmarketing.com/" aria-label="AlmLab home"><img src="img/logo.png" alt="AlmLab"></a>
  <a class="cta" id="navCta" href="https://almlabmarketing.com/#/strategy">Get in Touch</a>
</header>

<section class="hero" id="hero">
  <h1><span>Interactive Portfolio</span><span>that you can explore</span></h1>
  <p id="heroSub">Click on pages to view works, hover to see how they act in motion</p>
</section>

<div class="hint" id="hint"><i></i> <span>Click the book to open it</span></div>
<div class="tip" id="tip">View site ↗</div>

<nav class="bar" id="bar" aria-label="Current spread">
  <button id="prev" aria-label="Previous page">‹</button>
  <a id="linkL" class="empty" target="_blank" rel="noopener"></a>
  <span class="sep"></span>
  <a id="linkR" class="empty" target="_blank" rel="noopener"></a>
  <button id="next" aria-label="Next page">›</button>
</nav>

<div class="loader" id="loader"><div><b id="loadbar"></b></div></div>

<script src="gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
gsap.ticker.lagSmoothing(0);   // slow frames skip ahead instead of playing in slow motion
import { EffectComposer } from './vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/three-addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/three-addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './vendor/three-addons/postprocessing/OutputPass.js';

/* =====================================================================
   THE WORK — order is the order in the book. `img` is the full-page
   screenshot that plays on hover; img/pages/workNN.webp is the printed page.
   ===================================================================== */
const WORKS = [
  { n:'01', title:'AlmLab Instant Lead Reply', url:'https://almlabmarketing.com/reply/', img:'img/reply.jpg' },
  { n:'02', title:'All Leaders Follow',        url:'https://allleadersfollow.vercel.app/index.html', img:'img/allleaders.jpg' },
  { n:'03', title:'Pentium Logistics',         url:'https://www.pentiumenvironmentallogistics.ie/', img:'img/pentium.jpg' },
  { n:'04', title:'Mejia Landscaping',         url:'https://mejia-psi.vercel.app/', img:'img/mejia.jpg' },
  { n:'05', title:'Big Bear Planetariums',     url:'http://www.bigbearplanetariums.ie/', img:'img/bigbear.png' },
  { n:'06', title:'Five Star Home Improvement',url:'https://www.5starhomeimprovements.ie/', img:'img/fivestar.jpg' },
  { n:'07', title:'Evolve Gym Equipment',      url:'https://www.evolvege.ie/', img:'img/evolve.jpg' },
  { n:'08', title:'Attics R Us',               url:'https://www.atticsrus.ie/', img:'img/attics.jpg' },
  { n:'09', title:'Quality Fencing',           url:'https://www.qualityfencing.ie/', img:'img/qualityfencing.jpg' },
  { n:'10', title:'Diamond Flooring',          url:'https://www.diamondflooringdublin.ie/', img:'img/diamond.jpg' },
  { n:'11', title:'AL Fitness & Coaching',     url:'https://www.alfitnessandcoaching.com/', img:'img/alfitness.jpg' },
  { n:'12', title:'15-50 Cabins',              url:'https://www.1550.ie/', img:'img/cabins.jpg' },
  { n:'13', title:'Manchester Paving & Patios',url:'https://www.manchesterpavingandpatios.co.uk/', img:'img/manchester.jpg' },
  { n:'14', title:'SH Interior',               url:'https://www.irsh.ie/', img:'img/shinterior.jpg' },
  { n:'15', title:'Omni Renovations',          url:'https://www.omnirenovations.ie/', img:'img/omni.jpg' },
  { n:'16', title:'Seattle Core Masonry',      url:'https://www.chimneyrepairsseattle.com/', img:'img/seattle.jpg' },
  { n:'17', title:'Floor Trade Ireland',       url:'https://www.floortradeireland.ie/', img:'img/floortrade.jpg' },
  { n:'18', title:'Supreme Landscapes',        url:'https://www.supremelandscapesdublin.ie/', img:'img/supreme.jpg' },
];

/* =====================================================================
   FEEL — the knobs most worth turning
   ===================================================================== */
const CONFIG = {
  flipSeconds: 0.78,       // one page turn
  cascadeGap: 0.06,        // seconds between leaves when jumping several pages
  cameraSeconds: 1.7,      // the dolly in when the book opens
  bloom: { strength: 0.22, radius: 0.45, threshold: 0.92 },
  lamp: 9,                 // the desk lamp: lights the wood, the book and casts the shadows
  desk: 1.0,               // brightness of the wood
  parallax: 0.018,         // how much the camera follows the mouse
  hoverScrollSpeed: 0.055, // page heights per second when a page plays on hover
};

/* =====================================================================
   BOOK GEOMETRY — metres, matching the Blender scene the desk was baked in
   ===================================================================== */
const PAGE_W = 0.30, PAGE_D = 0.16875;     // 16:9 leaf; spine at x=0, fore edge at +x, depth along z
const LEAF_T = 0.0009, BOARD_T = 0.0025, OVER = 0.004;
const SEGS = 40;
const N_LEAVES = 11;                        // cover + 9 work leaves + back cover

/* FRAMING — where the book sits on screen. The camera solves for these on every screen shape.
   cx, cy: centre of the book as a fraction of the screen; w: its width as a fraction of the screen
   el: camera tilt. On phones, tapping a page zooms to it (focus) and a second tap opens the site. */
const FRAMING = {
  landscape: { closed: { el: 58, cx: 0.55, cy: 0.62, w: 0.30 }, open: { el: 58, cx: 0.50, cy: 0.56, w: 0.86 } },
  portrait:  { closed: { el: 66, cx: 0.50, cy: 0.58, w: 0.86 }, open: { el: 76, cx: 0.50, cy: 0.52, w: 0.97 },
               focus:  { el: 80, cx: 0.50, cy: 0.50, w: 0.96 } },   // phones: one page zoomed to fill the width
};
const PENCIL = { x: -0.24, z: 0.2, turn: 35 };   // where the pencil lies (metres from the spine) and its angle in degrees
const LENS = { landscape: 34, portrait: 22 };   // field of view in degrees across the long side of the frame; lower = longer lens, less looming

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchOnly = matchMedia('(hover: none)').matches;
const small = Math.min(screen.width, screen.height) < 820 || matchMedia('(pointer: coarse)').matches;

/* =====================================================================
   RENDERER + POST
   ===================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, small ? 2 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 20);

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), small ? CONFIG.bloom.strength * 0.6 : CONFIG.bloom.strength, CONFIG.bloom.radius, small ? 0.92 : CONFIG.bloom.threshold);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =====================================================================
   LIGHT — one desk lamp lights everything and casts the shadows
   ===================================================================== */
const lamp = new THREE.SpotLight(0xeef4ff, CONFIG.lamp, 4, 0.36, 1, 2);
lamp.position.set(0.15, 1.7, -0.35);
lamp.target.position.set(0.12, 0, -0.02);
lamp.castShadow = true;
lamp.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
lamp.shadow.bias = -0.00012; lamp.shadow.normalBias = 0.0015; lamp.shadow.radius = 5;
lamp.shadow.camera.near = 0.8; lamp.shadow.camera.far = 2.4;
scene.add(lamp, lamp.target);
scene.add(new THREE.HemisphereLight(0x9aa6c0, 0x050505, 0.06));

/* small procedural studio for reflections on the cover */
function studio() {
  const room = new THREE.Scene();
  room.add(new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshBasicMaterial({ color: 0x050506, side: THREE.BackSide })));
  const panel = (w, h, c, x, y, z, rx) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c), side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.x = rx; room.add(m); };
  panel(1.4, 1.0, 0xf0f4ff, 0.15, 1.8, -0.3, Math.PI / 2);
  panel(0.6, 2.0, 0x1a2030, -2.8, 1.0, 0.5, 0);
  const pm = new THREE.PMREMGenerator(renderer);
  const env = pm.fromScene(room, 0.03).texture; pm.dispose(); return env;
}
scene.environment = studio();

/* =====================================================================
   LOADING
   ===================================================================== */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const loader = new THREE.TextureLoader();
let loaded = 0, toLoad = 0;
const loadbar = document.getElementById('loadbar');
function tex(src, { srgb = true, repeat = false } = {}) {
  toLoad++;
  return new Promise((res, rej) => loader.load(src, (t) => {
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    loaded++; loadbar.style.width = `${(loaded / toLoad) * 100}%`;
    res(t);
  }, undefined, () => rej(new Error('could not load ' + src))));
}

/* =====================================================================
   DESK — dark wood drawn live on the GPU, and a pencil
   ===================================================================== */
/* The wood is drawn by the GPU at whatever resolution the screen has, so it never blurs.
   Grain runs left to right; fine detail fades out with distance so it never shimmers. */
const WOOD_GLSL = `
uniform float woodTone;
varying vec2 vWood;
float wh(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float wn(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(wh(i), wh(i + vec2(1, 0)), u.x), mix(wh(i + vec2(0, 1)), wh(i + vec2(1, 1)), u.x), u.y); }
float wf(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * wn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float aa(float v, float x) { return mix(v, 0.5, clamp(fwidth(x) * 1.5, 0.0, 1.0)); }
float lines(float r, float x, float halfw) {   // thin grain lines, each with its own strength and breaks
  float id = floor(r), t = abs(fract(r) - 0.5), w = fwidth(r);
  float l = 1.0 - smoothstep(halfw - w, halfw + w, t);
  l *= (0.25 + 0.75 * wn(vec2(x * 5.0 + id * 7.31, id * 1.73))) * smoothstep(0.2, 0.65, wn(vec2(x * 16.0, id * 3.17)));
  return mix(l, halfw * 0.9, clamp(w * 1.4 - 0.2, 0.0, 1.0));   // far away: average out instead of shimmering
}
float woodGrain(vec2 p) {
  float warp = wf(vec2(p.x * 2.6, p.y * 3.0)) * 0.9 + wf(vec2(p.x * 0.7, p.y * 0.9)) * 2.6;
  float coarse = lines(p.y * 240.0 + warp * 14.0, p.x, 0.12);
  float fine = lines(p.y * 620.0 + warp * 36.0 + 0.37, p.x * 1.7, 0.08);
  float tone = wf(vec2(p.x * 1.6, p.y * 9.0));
  return clamp(0.8 * coarse + 0.3 * fine + 0.4 * tone - 0.15, 0.0, 1.0);
}`;
function buildDesk() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.38, metalness: 0, envMapIntensity: 0.08 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.woodTone = { value: CONFIG.desk };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vWood;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWood = (modelMatrix * vec4(position, 1.0)).xz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + WOOD_GLSL)
      .replace('#include <map_fragment>', `float wg = woodGrain(vWood);
        diffuseColor.rgb = mix(vec3(0.0024, 0.0023, 0.0024), vec3(0.036, 0.036, 0.039), wg) * woodTone;`)
      .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = roughness + 0.3 * (1.0 - wg) - 0.1 * wg;');
  };
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), mat);
  desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true;
  scene.add(desk);
  scene.add(pencil());
}
/* a real pencil: black lacquered hexagonal body, sharpened cedar cone, graphite point */
function pencil() {
  const g = new THREE.Group(), r = 0.0036, L = 0.16, cone = 0.019;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 6), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.32, envMapIntensity: 0.9 }));
  body.rotation.z = Math.PI / 2;
  const wood = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.32, r, cone, 6), new THREE.MeshStandardMaterial({ color: 0x8a6a4c, roughness: 0.8 }));
  wood.rotation.z = Math.PI / 2; wood.position.x = L / 2 + cone / 2;
  const lead = new THREE.Mesh(new THREE.ConeGeometry(r * 0.32, 0.005, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.35, metalness: 0.6 }));
  lead.rotation.z = -Math.PI / 2; lead.position.x = L / 2 + cone + 0.0025;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.02, r * 1.02, 0.004, 6), new THREE.MeshStandardMaterial({ color: 0x9a9a9e, roughness: 0.3, metalness: 1 }));
  cap.rotation.z = Math.PI / 2; cap.position.x = -L / 2 - 0.002;
  g.add(body, wood, lead, cap);
  g.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  g.position.set(PENCIL.x, r * 0.87, PENCIL.z); g.rotation.y = THREE.MathUtils.degToRad(PENCIL.turn);
  return g;
}
function softShadow(w, d, x, opacity) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.filter = 'blur(18px)'; g.fillStyle = '#000'; g.fillRect(36, 44, 184, 168);
  const t = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity, depthWrite: false, color: 0x000000 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.0002, 0); m.renderOrder = 1;
  scene.add(m); return m;
}

/* =====================================================================
   PAGES — a strip that bends around the spine; two single-sided layers
   ===================================================================== */
function leafGeometry(w, d) {
  const g = new THREE.BufferGeometry(), cols = SEGS + 1, per = cols * 2;
  const pos = new Float32Array(per * 2 * 3), uv = new Float32Array(per * 2 * 2), idx = [];
  for (let L = 0; L < 2; L++) for (let r = 0; r < 2; r++) for (let c = 0; c < cols; c++) {
    const i = L * per + r * cols + c;
    pos.set([(c / SEGS) * w, 0, r === 0 ? -d / 2 : d / 2], i * 3);
    uv.set([L === 0 ? c / SEGS : 1 - c / SEGS, r === 0 ? 1 : 0], i * 2);
  }
  for (let c = 0; c < SEGS; c++) { const a = c, b = c + 1, e = cols + c, f = cols + c + 1; idx.push(a, e, b, b, e, f); }
  const front = idx.length;
  for (let c = 0; c < SEGS; c++) { const a = per + c, b = per + c + 1, e = per + cols + c, f = per + cols + c + 1; idx.push(a, b, e, b, f, e); }
  g.setIndex(idx); g.addGroup(0, front, 0); g.addGroup(front, idx.length - front, 1);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
const screenMat = (map) => new THREE.MeshStandardMaterial({ map, emissiveMap: map, emissive: new THREE.Color(0.62, 0.62, 0.62), color: new THREE.Color(0.3, 0.3, 0.3), roughness: 0.85, metalness: 0, envMapIntensity: 0.15 });
const coverMat = (map) => new THREE.MeshStandardMaterial({ map, emissiveMap: map, emissive: new THREE.Color(0.5, 0.5, 0.5), roughness: 0.8, metalness: 0, envMapIntensity: 0.08, color: new THREE.Color(0.06, 0.06, 0.06) });   // black cloth, the printed logo reads white

const ease3 = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
class Leaf {
  /* flex 1 = paper, ~0.3 = board. A turn runs p from 0 to 1: the fore edge lifts first and leads,
     the page bends as it is carried over, then the hinge catches up and it lays down flat. */
  constructor(i, front, back, { w = PAGE_W, d = PAGE_D, flex = 1, frontMat, backMat } = {}) {
    this.i = i; this.w = w; this.flex = flex;
    this.from = 0; this.to = 0; this.p = 1; this.turn = 0; this.dirty = true;
    this.geo = leafGeometry(w, d);
    this.mesh = new THREE.Mesh(this.geo, [frontMat || screenMat(front), backMat || screenMat(back)]);
    this.mesh.castShadow = true; this.mesh.receiveShadow = true; this.mesh.userData.leaf = this;
  }
  base(t) {
    const right = BOARD_T + (N_LEAVES - 1 - this.i) * LEAF_T, left = BOARD_T + this.i * LEAF_T;
    return right + (left - right) * t;
  }
  update() {
    if (!this.dirty) return;
    this.dirty = false;
    const f = this.flex, p = this.p;
    const lead = 0.2 * f, lag = 0.13 * f;
    const span = (this.to - this.from) * Math.PI, a0 = this.from * Math.PI;
    const fore = a0 + span * ease3(p / (1 - lead));            // the edge you hold
    const hinge = a0 + span * ease3((p - lag) / (1 - lag));    // the spine side follows
    const bulge = Math.sin(Math.PI * p) * 0.5 * f;
    const lift = Math.cos((hinge + fore) / 2);   // bow away from whichever stack the page is over
    this.turn = this.from + (this.to - this.from) * ease3((p - lag) / (1 - lag));
    const pos = this.geo.attributes.position.array, cols = SEGS + 1, per = cols * 2, ds = this.w / SEGS;
    let x = 0, y = this.base(THREE.MathUtils.clamp(this.turn, 0, 1)) + 0.0003;
    for (let c = 0; c <= SEGS; c++) {
      if (c > 0) {
        const s = c / SEGS;
        const a = hinge + (fore - hinge) * Math.pow(s, 1.6) + bulge * lift * (s - s * s);   // lifted paper bows upward
        x += ds * Math.cos(a); y += ds * Math.sin(a);
      }
      const yy = Math.max(y, 0.0004);
      for (const k of [c, cols + c, per + c, per + cols + c]) { pos[k * 3] = x; pos[k * 3 + 1] = yy; }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals(); this.geo.computeBoundingSphere();
  }
}

/* =====================================================================
   BOOK
   ===================================================================== */
const book = new THREE.Group(); scene.add(book);
const leaves = [];
let spread = 0, opened = false, busy = 0, focus = null;   // focus: 'left' | 'right' page zoomed on phones
const parts = {};

function edgeTexture() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#d9d5cc'; g.fillRect(0, 0, 8, 128);
  for (let y = 0; y < 128; y += 2) { g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(0, y, 8, 1); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function buildBook(T) {
  const bw = PAGE_W + OVER, bd = PAGE_D + OVER * 2;
  leaves.push(new Leaf(0, null, null, { w: bw, d: bd, flex: 0.3, frontMat: coverMat(T.cover), backMat: screenMat(T.contents) }));
  for (let k = 0; k < 9; k++) leaves.push(new Leaf(k + 1, T.works[2 * k], T.works[2 * k + 1]));
  leaves.push(new Leaf(10, null, null, { w: bw, d: bd, flex: 0.3, frontMat: screenMat(T.end), backMat: coverMat(T.coverback) }));
  leaves.forEach(l => book.add(l.mesh));

  const cloth = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.6, envMapIntensity: 0.5 });
  const edge = new THREE.MeshStandardMaterial({ map: edgeTexture(), roughness: 0.9 });
  const full = N_LEAVES * LEAF_T + BOARD_T * 2;
  const mk = (geo, mat, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = shadow; m.receiveShadow = true; book.add(m); return m; };
  parts.board = mk(new THREE.BoxGeometry(bw, BOARD_T, bd), cloth); parts.board.position.set(bw / 2, BOARD_T / 2, 0);
  parts.boardL = mk(new THREE.BoxGeometry(bw, BOARD_T, bd), cloth); parts.boardL.position.set(-bw / 2, BOARD_T / 2, 0);
  parts.spine = mk(new THREE.BoxGeometry(BOARD_T * 1.6, full, bd), cloth); parts.spine.position.set(-BOARD_T * 0.6, full / 2, 0);
  parts.block = mk(new THREE.BoxGeometry(PAGE_W - 0.002, 1, PAGE_D - 0.002), edge);
  parts.blockL = mk(new THREE.BoxGeometry(PAGE_W - 0.002, 1, PAGE_D - 0.002), edge);
  parts.shR = softShadow(bw + 0.09, bd + 0.08, bw / 2, 0.75);
  parts.shL = softShadow(bw + 0.09, bd + 0.08, -bw / 2, 0.75);
  stacks();
}
/* the blocks stand in for the leaves underneath the top page on each side */
function stacks() {
  // only leaves lying still count; a leaf in the air must not be covered by the stack it left
  let right = 0, left = 0;
  for (const l of leaves) { const still = l.p >= 1; if (still && l.turn < 0.5) right++; else if (still) left++; }
  const place = (m, n, x) => { const h = Math.max(0, n - 1) * LEAF_T; m.visible = h > 0.0002; m.scale.y = Math.max(h - 0.0002, 0.0001); m.position.set(x, BOARD_T + m.scale.y / 2, 0); };
  place(parts.block, right, PAGE_W / 2); place(parts.blockL, left, -PAGE_W / 2);
  let anyRight = 0, anyLeft = 0; for (const l of leaves) (l.turn < 0.5 ? anyRight++ : anyLeft++);
  parts.board.visible = anyRight > 0 || right > 0; parts.boardL.visible = anyLeft > 0 || left > 0;
  parts.shR.material.opacity = parts.board.visible ? 0.75 : 0; parts.shL.material.opacity = parts.boardL.visible ? 0.75 : 0;
}

/* =====================================================================
   TURNING
   ===================================================================== */
const SPREADS = N_LEAVES;   // 0 closed front … 11 closed back
function go(s) {
  s = THREE.MathUtils.clamp(s, 0, SPREADS);
  if (s === spread) return;
  const dir = Math.sign(s - spread);
  const order = [];
  for (let i = 0; i < N_LEAVES; i++) if ((i < s) !== (i < spread)) order.push(i);
  if (dir < 0) order.reverse();
  stopHover();
  order.forEach((i, k) => {
    const l = leaves[i]; busy++;
    gsap.killTweensOf(l);
    l.from = l.turn; l.to = i < s ? 1 : 0; l.p = 0;
    gsap.to(l, { p: 1, duration: reduceMotion ? 0.01 : CONFIG.flipSeconds, delay: k * CONFIG.cascadeGap, ease: 'none',
      onUpdate: () => { l.dirty = true; }, onComplete: () => { busy = Math.max(0, busy - 1); l.dirty = true; l.update(); stacks(); } });
  });
  spread = s;
  const open = s > 0 && s < SPREADS;
  if (!open && focus) { focus = null; if (open === opened) moveCamera(); }
  if (open !== opened) { opened = open; moveCamera(); if (open && phoneMode() && !zoomHinted) { zoomHinted = true; showZoomHint(); } }
  ui();
  if (focus) setTimeout(playFocus, (reduceMotion ? 0 : CONFIG.flipSeconds * 1000) + 60);
}
/* phones: zoom to one page, play it like a hover */
const phoneMode = () => touchOnly && portrait();
function pageFace(side) {   // the leaf face showing on that side of the open spread
  const i = side === 'left' ? spread - 1 : spread;
  return i >= 0 && i < N_LEAVES ? { leaf: leaves[i], face: side === 'left' ? 1 : 0 } : null;
}
function playFocus() {
  if (!focus || busy) return;
  const f = pageFace(focus);
  if (f && workOn(f.leaf.i, f.face) && !(hover && hover.leaf === f.leaf && hover.face === f.face)) { stopHover(); startHover(f); }
}
function setFocus(side) {
  if (side === focus) return;
  focus = side; stopHover(); moveCamera(0.9); playFocus(); ui();
}
/* step one page at a time when zoomed in, a spread at a time otherwise */
function step(d) {
  if (!focus || !opened) { if (d > 0 && spread === SPREADS - 1) go(0); else go(spread + d); return; }
  if (d > 0) { if (focus === 'left') setFocus('right'); else if (spread >= SPREADS - 1) go(0); else { focus = 'left'; go(spread + 1); moveCamera(0.9); } }
  else { if (focus === 'right') setFocus('left'); else if (spread <= 1) { go(0); } else { focus = 'right'; go(spread - 1); moveCamera(0.9); } }
}

/* =====================================================================
   CAMERA
   ===================================================================== */
const cam = { x: 0, y: 0, z: 0, lx: 0, ly: 0, lz: 0, fov: 30 };
const pointer = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };
const portrait = () => innerWidth < innerHeight;
const _v = new THREE.Vector3(), _probe = new THREE.PerspectiveCamera();
function bookCorners(state) {
  const bw = PAGE_W + OVER, bd = PAGE_D / 2 + OVER;
  const x0 = state === 'open' || focus === 'left' && state === 'focus' ? -bw : -0.004;
  const x1 = state === 'focus' && focus === 'left' ? 0.004 : bw;
  return [[x0, -bd], [x1, -bd], [x0, bd], [x1, bd]].map(([x, z]) => new THREE.Vector3(x, 0.012, z));
}
function rigNow() {
  const orient = portrait() ? 'portrait' : 'landscape';
  const state = !opened ? 'closed' : focus && orient === 'portrait' ? 'focus' : 'open';
  const T = FRAMING[orient][state], e = THREE.MathUtils.degToRad(T.el), pts = bookCorners(state);
  _probe.fov = camera.fov; _probe.aspect = camera.aspect; _probe.near = 0.02; _probe.far = 30; _probe.updateProjectionMatrix();
  const vt = Math.tan(THREE.MathUtils.degToRad(_probe.fov) / 2), gx = 2 * vt * _probe.aspect, gz = 2 * vt / Math.sin(e);   // world size of the frame per unit distance
  let tx = 0, tz = 0, d = 1;
  for (let it = 0; it < 120; it++) {
    _probe.position.set(tx, Math.sin(e) * d, tz + Math.cos(e) * d); _probe.lookAt(tx, 0, tz); _probe.updateMatrixWorld();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) { _v.copy(p).project(_probe); const fx = (_v.x + 1) / 2, fy = (1 - _v.y) / 2; x0 = Math.min(x0, fx); x1 = Math.max(x1, fx); y0 = Math.min(y0, fy); y1 = Math.max(y1, fy); }
    if (!(x1 > x0)) { d *= 1.5; continue; }
    d *= Math.min(1.5, Math.max(0.67, Math.pow((x1 - x0) / T.w, 0.7)));
    tx += ((x0 + x1) / 2 - T.cx) * d * gx * 0.6;
    tz += ((y0 + y1) / 2 - T.cy) * d * gz * 0.6;
  }
  return { x: tx, y: Math.sin(e) * d, z: tz + Math.cos(e) * d, lx: tx, ly: 0, lz: tz };
}
function moveCamera(dur = CONFIG.cameraSeconds) {
  const r = rigNow();
  gsap.killTweensOf(cam);
  if (reduceMotion || dur < 0.05) { Object.assign(cam, r); return; }
  gsap.to(cam, { ...r, duration: dur, ease: 'power3.inOut' });
}
function fit() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  bloom.resolution.set(w / 2, h / 2);
  camera.aspect = a;
  const half = THREE.MathUtils.degToRad(LENS[portrait() ? 'portrait' : 'landscape']) / 2;
  camera.fov = THREE.MathUtils.radToDeg(a >= 1 ? 2 * Math.atan(Math.tan(half) / a) : 2 * half);   // three.js fov is vertical
  camera.updateProjectionMatrix();
}
function placeCamera(dt) {
  ptr.x += (pointer.x - ptr.x) * Math.min(1, dt * 3); ptr.y += (pointer.y - ptr.y) * Math.min(1, dt * 3);
  const p = reduceMotion || touchOnly ? 0 : CONFIG.parallax;
  camera.position.set(cam.x + ptr.x * p, cam.y - ptr.y * p * 0.5, cam.z + ptr.y * p);
  camera.lookAt(cam.lx + ptr.x * p * 0.3, cam.ly, cam.lz);
}

/* =====================================================================
   HOVER — a page plays: tall sites scroll, short ones drift
   ===================================================================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hover = null;   // { leaf, face, work, tex, start }
const fullTex = new Map();
function workOn(leafIndex, face) {
  if (leafIndex < 1 || leafIndex > 9) return null;
  return WORKS[(leafIndex - 1) * 2 + (face === 0 ? 0 : 1)] ?? null;
}
function pick(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...leaves.map(l => l.mesh), parts.block, parts.blockL, parts.board, parts.boardL].filter(Boolean), false);
  return hits[0] || null;
}
function faceAt(hit) {
  const l = hit?.object.userData.leaf; if (!l || !opened || busy) return null;
  const face = hit.face.materialIndex;      // 0 front (right page), 1 back (left page)
  if (face === 0 && l.i !== spread) return null;
  if (face === 1 && l.i !== spread - 1) return null;
  return { leaf: l, face, uv: hit.uv };
}
async function startHover(f) {
  const work = workOn(f.leaf.i, f.face);
  if (!work) return;
  hover = { ...f, work, start: performance.now(), base: f.leaf.mesh.material[f.face].map };   // map and emissiveMap are the same image
  let t = fullTex.get(work.img);
  if (!t) { t = await tex(work.img); fullTex.set(work.img, t); }
  if (!hover || hover.work !== work) return;
  const im = t.image, win = Math.min(1, (im.width * PAGE_D / PAGE_W) / im.height);
  hover.tex = t; hover.win = win;
  t.repeat.set(1, win); t.offset.set(0, 1 - win);
  const hm = f.leaf.mesh.material[f.face]; hm.map = t; hm.emissiveMap = t; hm.needsUpdate = true;
}
function stopHover() {
  if (!hover) return;
  const m = hover.leaf.mesh.material[hover.face];
  m.map = hover.base; m.emissiveMap = hover.base; m.needsUpdate = true; hover = null;
  tip.classList.remove('on'); canvas.style.cursor = 'default';
}
function tickHover() {
  if (!hover?.tex) return;
  const el = (performance.now() - hover.start) / 1000, t = hover.tex;
  if (hover.win < 0.98) {
    // scroll down the page, rest at the bottom, glide back up
    const travel = 1 - hover.win, dur = travel / CONFIG.hoverScrollSpeed + 1.2;
    const p = (el % (dur * 2)) / dur, k = p < 1 ? p : 2 - p;
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    t.offset.y = (1 - hover.win) * (1 - e);
  } else {
    // short pages: a slow push-in
    const z = 1 - 0.06 * (0.5 - 0.5 * Math.cos(el * 0.5));
    t.repeat.set(z, z * hover.win); t.offset.set((1 - z) / 2, (1 - z * hover.win) / 2);
  }
}

/* =====================================================================
   INPUT
   ===================================================================== */
const tip = document.getElementById('tip');
let downAt = null;
canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = (e.clientY / innerHeight) * 2 - 1;
  if (e.pointerType !== 'mouse') return;
  const hit = pick(e.clientX, e.clientY);
  const f = faceAt(hit);
  if (!opened) { canvas.style.cursor = hit ? 'pointer' : 'default'; return; }
  const same = f && hover && hover.leaf === f.leaf && hover.face === f.face;
  if (!same) { stopHover(); if (f && workOn(f.leaf.i, f.face)) startHover(f); }
  const showTip = f && (workOn(f.leaf.i, f.face) || (f.leaf.i === 0 && f.face === 1));
  canvas.style.cursor = hit ? 'pointer' : 'default';
  tip.textContent = f && f.leaf.i === 0 ? 'Jump to project' : 'View site ↗';
  tip.classList.toggle('on', !!showTip && !(f.leaf.i === 0 && !contentsRow(f)));
  tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
}, { passive: true });
canvas.addEventListener('pointerleave', () => { stopHover(); pointer.x = pointer.y = 0; });
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y, quick = performance.now() - downAt.t < 600;
  downAt = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { hideHint(); step(dx < 0 ? 1 : -1); return; }   // swipe
  if (Math.hypot(dx, dy) > 10 || !quick) return;
  hideHint();
  const hit = pick(e.clientX, e.clientY);
  if (!opened) { if (hit) go(spread === 0 ? 1 : 0); return; }
  const f = faceAt(hit);
  if (phoneMode() && f) {   // phones: first tap zooms to the page, second tap acts on it
    const side = hit.point.x < 0 ? 'left' : 'right';
    if (focus !== side) { setFocus(side); return; }
  } else if (phoneMode() && focus) { setFocus(null); return; }
  if (f) {
    const w = workOn(f.leaf.i, f.face);
    if (w) { openSite(w.url); return; }
    if (f.leaf.i === 0 && f.face === 1) { const row = contentsRow(f); if (row) { go(row); return; } }
  }
  // anywhere else: turn toward the side that was clicked
  step(e.clientX < innerWidth / 2 ? -1 : 1);
});
/* contents page: which project row was clicked (design px of the 1536×864 page) */
function contentsRow(f) {
  if (!f?.uv) return 0;
  const px = f.uv.x * 1536, py = (1 - f.uv.y) * 864;
  const colX = [600, 1070], top = 190, step = 56;
  for (let i = 0; i < WORKS.length; i++) {
    const x = colX[Math.floor(i / 9)], y = top + (i % 9) * step;
    if (px >= x - 10 && px <= x + 420 && py >= y - 32 && py <= y + 20) return Math.floor(i / 2) + 1 + (i % 2);   // odd projects sit on the next spread's left page
  }
  return 0;
}
function openSite(url) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
let wheelAcc = 0, wheelLock = 0;
addEventListener('wheel', (e) => {
  e.preventDefault();
  const now = performance.now(); if (now < wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 60) { hideHint(); const d = Math.sign(wheelAcc); wheelAcc = 0; wheelLock = now + CONFIG.flipSeconds * 600; if (d > 0 && spread === SPREADS - 1) go(0); else go(spread + d); }
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(spread >= SPREADS - 1 ? 0 : spread + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(spread - 1); }
  if (e.key === 'Escape') { if (focus) setFocus(null); else go(0); }
});
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));

/* =====================================================================
   UI
   ===================================================================== */
const hero = document.getElementById('hero'), bar = document.getElementById('bar'), hint = document.getElementById('hint');
const linkL = document.getElementById('linkL'), linkR = document.getElementById('linkR');
if (touchOnly) { document.getElementById('heroSub').textContent = 'Tap the book to open it, tap a page to zoom in, tap again to visit'; hint.querySelector('span').textContent = 'Tap the book to open it'; }
function hideHint() { hint.classList.add('off'); }
let zoomHinted = false;
function showZoomHint() {   // phones: after the book opens, say how to zoom in
  setTimeout(() => { hint.querySelector('span').textContent = 'Tap a page to zoom in'; hint.classList.add('up'); hint.classList.remove('off'); gsap.to(hint, { opacity: 1, duration: 0.6 }); }, 1200);
}
function setLink(el, w) { el.classList.toggle('empty', !w); if (w) { el.href = w.url; el.innerHTML = `<span class="k">${w.n}</span>${w.title}<span class="go">↗</span>`; } }
let heroShown = true;
function ui() {
  const open = spread > 0 && spread < SPREADS;
  if (open === heroShown) { heroShown = !open; gsap.to(hero, { autoAlpha: open ? 0 : 1, y: open ? -16 : 0, duration: 0.7, ease: 'power2.out', overwrite: true }); }
  bar.classList.toggle('on', open);
  setLink(linkL, open ? workOn(spread - 1, 1) : null);
  setLink(linkR, open ? workOn(spread, 0) : null);
  linkL.classList.toggle('dim', focus === 'right'); linkR.classList.toggle('dim', focus === 'left');
  document.getElementById('prev').disabled = spread <= 0;
}
function intro() {
  gsap.timeline({ defaults: { ease: 'power3.out' } })
    .to('#navLogo, #navCta', { opacity: 1, duration: 0.9, stagger: 0.1 }, 0.1)
    .to('.hero h1 span', { opacity: 1, y: 0, duration: 1.1, stagger: 0.12 }, 0.25)
    .to('#heroSub', { opacity: 1, duration: 0.9 }, 0.8)
    .to('#hint', { opacity: 1, duration: 0.8 }, 1.2);
}

/* =====================================================================
   BOOT
   ===================================================================== */
const pageTex = (n) => tex(`img/pages/${n}.webp`);
async function boot() {
  const [cover, coverback, contents, end, ...works] = await Promise.all([
    pageTex('cover'), pageTex('coverback'), pageTex('contents'), pageTex('end'),
    ...WORKS.map((w, i) => pageTex('work' + String(i + 1).padStart(2, '0'))),
  ]);
  buildDesk();
  buildBook({ cover, coverback, contents, end, works });
  fit(); Object.assign(cam, rigNow());
  leaves.forEach(l => l.update()); placeCamera(0.016);
  renderer.compile(scene, camera); composer.render();
  document.getElementById('loader').classList.add('off');
  intro();
  window.almBook = { go, step, setFocus, get spread() { return spread; }, get focus() { return focus; } };
  last = performance.now(); requestAnimationFrame(loop);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const l of leaves) l.update();
  stacks();
  tickHover();
  placeCamera(dt);
  composer.render();
  requestAnimationFrame(loop);
}
let lastPortrait = portrait();
addEventListener('resize', () => { fit(); lastPortrait = portrait(); moveCamera(0.01); });
boot().catch(err => { console.error(err); document.getElementById('loader').innerHTML = `<p style="font:14px Poppins;color:#fff">Could not load the book. ${err?.message ?? ''}</p>`; });
</script>
</body>
</html>
